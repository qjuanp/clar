name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-26.04

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 26.x
              uses: actions/setup-node@v7
              with:
                  node-version: 26.x
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm run test:unit
