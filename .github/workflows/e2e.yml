name: E2E tests

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 26.x
              uses: actions/setup-node@v7
              with:
                  node-version: 26.x
                  cache: 'npm'
            - run: npm ci
            - name: Cache Obsidian binaries
              uses: actions/cache@v6
              with:
                  path: .obsidian-cache
                  key: obsidian-latest-${{ runner.os }}
            - run: xvfb-run --auto-servernum npm run test:e2e
